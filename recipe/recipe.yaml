schema_version: 1

context:
  name: amset
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/amset-${{ version }}.tar.gz
  sha256: bb80bacedaef682b9e97faefb901f530b21eb8cf27ee3b208e5e5e6540f8f60b

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - amset = amset.tools.cli:cli

requirements:
  host:
    - numpy
    - pip
    - python ${{ python_min }}.*
    - setuptools <80
  run:
    - boltztrap2
    - click
    - h5py
    - interpolation
    - matplotlib-base
    - memory_profiler
    - monty
    - numba
    - pyfftw
    - pymatgen >=2022.0.16
    - python >=${{ python_min }}
    - scipy
    - spglib <2.7
    - sumo
    - tabulate
    - tqdm
    - setuptools <80

tests:
  - python:
      imports:
        - amset
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - amset --help

about:
  summary: AMSET is a tool to calculate carrier transport properties from ab initio calculation data
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/hackingmaterials/amset

extra:
  recipe-maintainers:
    - jan-janssen
